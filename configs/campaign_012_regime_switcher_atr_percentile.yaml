# CAMPAIGN_012 — Daily-ATR-percentile regime switcher (real candidate scaffold)
# RESEARCH CANDIDATE SCAFFOLD ONLY — NOT APPROVED FOR PAPER / DEMO / LIVE.
#
# Strategy: regime_switcher_atr_percentile 0.1.0-c012 — the C3
# daily-ATR-percentile regime switcher selected by the
# research-new-candidate-strategy-discovery-003 sprint as the next
# preferred real candidate. **Scaffold only — no backtest verdict
# yet, no walk-forward evidence, no financing overlay evidence, no
# risk diagnostics evidence, no verifier corroboration, no human
# approval.**
#
# The regime gate fires only when the prior completed day's D1AGG
# ATR-14 is in the top 30 % of the trailing 60 completed days
# (HIGH-VOL regime); direction comes from an H4 close-vs-close trend
# sub-signal with an ATR-fraction floor. Calm regimes do not trade.
# Exit is time-stop only (max 6 H4 bars ≈ 1 trading day).
#
# Frozen parameters pre-committed BEFORE any code by the
# discovery-003 sprint; any deviation constitutes a NEW candidate
# (see docs/research/REGIME_SWITCHER_ATR_PERCENTILE_IMPLEMENTATION_SPEC.md
# §2). The Pydantic validator on RegimeSwitcherAtrPercentileStrategyConfig
# rejects several specific deviations explicitly (e.g. trailing-stop
# in v1).
#
# Exact rules + parameter rationale:
# - docs/research/REGIME_SWITCHER_ATR_PERCENTILE_IMPLEMENTATION_SPEC.md
# - docs/research/C3_REGIME_SWITCHER_FEASIBILITY_REVIEW.md
# - docs/research/NEXT_PREFERRED_REAL_CANDIDATE_IMPLEMENTATION_DESIGN_003.md
# - docs/research/CAMPAIGN_012_PRECOMMIT_CHECKLIST.md
#
# This config is provided so future research / smoke / walk-forward
# sprints can load it via forex_bot.config.load_settings(...). Loading
# this config does NOT approve the strategy. configs/approved_strategies.yaml
# remains approved: [] and the paper-loop / demo-loop refusal still
# blocks every order-capable loop.
#
# DATA REUSE: database_path points at data/campaign_002.sqlite3 — the
# real OANDA practice H4 candles already validated by CAMPAIGN_002 /
# CAMPAIGN_010 / CAMPAIGN_011 (provenance hashes recorded). No re-fetch,
# no synthetic data. Same physical store as the prior campaigns; the
# regime-switcher hypothesis is tested on byte-for-byte identical
# candles, isolating the regime-gate effect.
#
# CAMPAIGN_002 remains REJECT and is untouched. CAMPAIGN_010 remains
# REJECT and is untouched. CAMPAIGN_011 remains REJECT (null-model
# anchor) and is untouched — CAMPAIGN_011 is the NULL BASELINE that
# the future CAMPAIGN_012 evidence sprint must beat by a meaningful
# margin; it is NOT itself a trading candidate.

app:
  name: oanda-forex-research-bot
  mode: paper
  trading_enabled: false
  allow_order_submission: false
  allow_live_trading: false
  database_path: ./data/campaign_002.sqlite3
  log_path: ./logs/campaign_012.jsonl
  kill_switch_path: ./KILL_SWITCH

broker:
  name: oanda
  environment: practice
  account_id_env: OANDA_ACCOUNT_ID_PRACTICE
  token_env: OANDA_ACCESS_TOKEN_PRACTICE
  request_timeout_seconds: 15
  max_retries: 3

market:
  account_currency: USD
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - AUD_USD
    - USD_CAD
    - USD_CHF
    - NZD_USD
  granularity: H4
  candle_price_components: BA
  daily_alignment: 17
  alignment_timezone: America/New_York
  weekly_alignment: Friday

strategy:
  enabled:
    - regime_switcher_atr_percentile
  regime_switcher_atr_percentile:
    version: 0.1.0-c012
    timeframe: H4
    # H4 ATR for stop sizing (mirrors session_breakout / random_entry_anchor).
    atr_lookback: 14
    atr_stop_multiple: 2.0
    trailing_stop_atr_multiple: null
    max_bars_in_trade: 6
    min_atr_pips: {}
    # D1AGG ATR for the regime feature.
    daily_atr_lookback: 14
    regime_lookback_days: 60
    regime_percentile_threshold: 0.70
    min_close_move_atr_fraction: 0.25
    trend_lookback_h4_bars: 4

risk:
  starting_equity_usd: 500
  risk_per_trade_pct: 0.25
  max_risk_per_trade_pct: 0.50
  max_daily_loss_pct: 1.00
  max_weekly_loss_pct: 2.00
  max_total_drawdown_pct: 8.00
  max_open_positions: 1
  max_pending_orders: 1
  max_correlated_positions: 1
  max_positions_per_instrument: 1
  require_stop_loss: true
  require_server_side_protection: true
  allow_martingale: false
  allow_grid: false
  allow_averaging_down: false

margin:
  min_margin_available_pct_of_nav: 80
  max_margin_used_pct_of_nav: 10
  reject_if_margin_closeout_percent_above: 20

spread_filter:
  enabled: true
  max_spread_to_atr_pct: 8.0
  max_spread_pips:
    EUR_USD: 1.5
    GBP_USD: 2.5
    USD_JPY: 2.0
    AUD_USD: 2.0
    USD_CAD: 2.5
    USD_CHF: 2.0
    NZD_USD: 2.5

session_filter:
  enabled: true
  timezone: America/New_York
  block_new_trades:
    - name: rollover
      start: "16:45"
      end: "17:15"
    - name: friday_close
      day: Friday
      start: "15:00"
      end: "23:59"
    - name: sunday_open
      day: Sunday
      start: "00:00"
      end: "19:00"

backtest:
  fixed_slippage_pips: 0.2
  spread_slippage_multiplier: 0.5
  starting_equity_usd: 500
  commission_per_unit: 0.0
