# CAMPAIGN_006 — daily (D1) trend following. Research Marathon 001, Phase 2.
#
# Frozen baseline trend_following rules, run on D1. Only difference from
# CAMPAIGN_002 is the timeframe. Rationale + gates:
# docs/research/CAMPAIGN_006_DAILY_TREND_PRECOMMIT.md
#
# Reuses data/campaign_002.sqlite3 — D1 candles fetched into it from
# OANDA practice (provenance recorded in data_sources, campaign
# CAMPAIGN_006). H4/H1 rows untouched.

app:
  name: oanda-forex-research-bot
  mode: paper
  trading_enabled: false
  allow_order_submission: false
  allow_live_trading: false
  database_path: ./data/campaign_002.sqlite3
  log_path: ./logs/campaign_006.jsonl
  kill_switch_path: ./KILL_SWITCH

broker:
  name: oanda
  environment: practice
  account_id_env: OANDA_ACCOUNT_ID_PRACTICE
  token_env: OANDA_ACCESS_TOKEN_PRACTICE
  request_timeout_seconds: 15
  max_retries: 3

market:
  account_currency: USD
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - AUD_USD
    - USD_CAD
    - USD_CHF
  granularity: D
  candle_price_components: BA
  daily_alignment: 17
  alignment_timezone: America/New_York
  weekly_alignment: Friday

strategy:
  enabled:
    - trend_following
  trend_following:
    version: 0.1.0-baseline-frozen
    timeframe: D
    ema_fast: 50
    ema_slow: 200
    donchian_lookback: 20
    atr_lookback: 14
    atr_stop_multiple: 2.0
    trailing_stop_atr_multiple: 2.0
    min_atr_pips: {}
    max_bars_in_trade: 60

risk:
  starting_equity_usd: 500
  risk_per_trade_pct: 0.25
  max_risk_per_trade_pct: 0.50
  max_daily_loss_pct: 1.00
  max_weekly_loss_pct: 2.00
  max_total_drawdown_pct: 8.00
  max_open_positions: 1
  max_pending_orders: 1
  max_correlated_positions: 1
  max_positions_per_instrument: 1
  require_stop_loss: true
  require_server_side_protection: true
  allow_martingale: false
  allow_grid: false
  allow_averaging_down: false

margin:
  min_margin_available_pct_of_nav: 80
  max_margin_used_pct_of_nav: 10
  reject_if_margin_closeout_percent_above: 20

spread_filter:
  enabled: true
  max_spread_to_atr_pct: 8.0
  max_spread_pips:
    EUR_USD: 1.5
    GBP_USD: 2.5
    USD_JPY: 2.0
    AUD_USD: 2.0
    USD_CAD: 2.5
    USD_CHF: 2.0

session_filter:
  enabled: true
  timezone: America/New_York
  block_new_trades:
    - name: rollover
      start: "16:45"
      end: "17:15"
    - name: friday_close
      day: Friday
      start: "15:00"
      end: "23:59"
    - name: sunday_open
      day: Sunday
      start: "00:00"
      end: "19:00"

backtest:
  fixed_slippage_pips: 0.2
  spread_slippage_multiplier: 0.5
  starting_equity_usd: 500
  commission_per_unit: 0.0
