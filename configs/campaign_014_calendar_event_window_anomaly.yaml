# CAMPAIGN_014 — Calendar-Event Window Anomaly (real candidate scaffold)
# RESEARCH CANDIDATE SCAFFOLD ONLY — NOT APPROVED FOR PAPER / DEMO / LIVE.
#
# Strategy: calendar_event_window_anomaly 0.1.0-c014 — the C7 Calendar-
# Event Window Anomaly candidate selected by the
# research-new-candidate-strategy-discovery-005 sprint as the next
# preferred real candidate. **Scaffold only — no backtest verdict
# yet, no walk-forward evidence, no financing overlay evidence, no
# risk diagnostics evidence, no verifier corroboration, no human
# approval.**
#
# The strategy fires counter to the first post-event H4 bar's
# directional move, with ATR-2 stop and a max-hold time stop of
# `max_post_event_bars` H4 bars. One entry per event-pair cell;
# overlap precedence FOMC > NFP > ECB > BoJ > BoE.
#
# Frozen parameters pre-committed BEFORE any code by the discovery-005
# sprint; any deviation constitutes a NEW candidate (see
# docs/research/CALENDAR_EVENT_WINDOW_ANOMALY_IMPLEMENTATION_SPEC.md §5).
# The Pydantic validator on CalendarEventWindowAnomalyStrategyConfig
# rejects several specific deviations explicitly (impact_ordering not
# a permutation of event_set; trailing-stop in v1; out-of-range
# window/lookback/multiple).
#
# Exact rules + parameter rationale:
# - docs/research/CALENDAR_EVENT_WINDOW_ANOMALY_IMPLEMENTATION_SPEC.md
# - docs/research/NEXT_PREFERRED_CANDIDATE_IMPLEMENTATION_DESIGN_005.md
# - docs/research/CAMPAIGN_014_PRECOMMIT_CHECKLIST.md
#
# This config is provided so future research / smoke / walk-forward
# sprints can load it via forex_bot.config.load_settings(...). Loading
# this config does NOT approve the strategy. configs/approved_strategies.yaml
# remains approved: [] and the paper-loop / demo-loop refusal still
# blocks every order-capable loop.
#
# DATA REUSE: database_path points at data/campaign_002.sqlite3 — the
# real OANDA practice H4 candles already validated by CAMPAIGN_002 /
# CAMPAIGN_010 / CAMPAIGN_011 / CAMPAIGN_012 / CAMPAIGN_013 (provenance
# hashes recorded). No re-fetch, no synthetic data. Same physical
# store as the prior campaigns; the event-window-anomaly hypothesis is
# tested on byte-for-byte identical candles, isolating the event-window
# counter-trend signal effect.
#
# EVENT FIXTURE: research/calendar/fixtures/campaign_014_events.json
# (committed text file; 281 scheduled events; deterministic; broker-
# free; provenance in CAMPAIGN_014_EVENT_FIXTURE_PROVENANCE.md).
#
# CAMPAIGN_002 / 010 / 011 / 012 / 013 all REJECT and untouched.
# CAMPAIGN_011 is the NULL BASELINE that the future CAMPAIGN_014
# evidence sprint must beat by a meaningful margin; it is NOT itself
# a trading candidate.

app:
  name: oanda-forex-research-bot
  mode: paper
  trading_enabled: false
  allow_order_submission: false
  allow_live_trading: false
  database_path: ./data/campaign_002.sqlite3
  log_path: ./logs/campaign_014.jsonl
  kill_switch_path: ./KILL_SWITCH

broker:
  name: oanda
  environment: practice
  account_id_env: OANDA_ACCOUNT_ID_PRACTICE
  token_env: OANDA_ACCESS_TOKEN_PRACTICE
  request_timeout_seconds: 15
  max_retries: 3

market:
  account_currency: USD
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - AUD_USD
    - USD_CAD
    - USD_CHF
    - NZD_USD
  granularity: H4
  candle_price_components: BA
  daily_alignment: 17
  alignment_timezone: America/New_York
  weekly_alignment: Friday

strategy:
  enabled:
    - calendar_event_window_anomaly
  calendar_event_window_anomaly:
    version: 0.1.0-c014
    timeframe: H4
    event_calendar_path: research/calendar/fixtures/campaign_014_events.json
    event_set:
      - NFP
      - FOMC
      - ECB
      - BoJ
      - BoE
    impact_ordering:
      - FOMC
      - NFP
      - ECB
      - BoJ
      - BoE
    post_event_window_bars: 6
    atr_lookback: 14
    atr_stop_multiple: 2.0
    trailing_stop_atr_multiple: null
    max_post_event_bars: 6
    re_entry_block_bars: 3
    event_warmup_bars: 1
    min_atr_pips: {}

risk:
  starting_equity_usd: 500
  risk_per_trade_pct: 0.25
  max_risk_per_trade_pct: 0.50
  max_daily_loss_pct: 1.00
  max_weekly_loss_pct: 2.00
  max_total_drawdown_pct: 8.00
  max_open_positions: 1
  max_pending_orders: 1
  max_correlated_positions: 1
  max_positions_per_instrument: 1
  require_stop_loss: true
  require_server_side_protection: true
  allow_martingale: false
  allow_grid: false
  allow_averaging_down: false

margin:
  min_margin_available_pct_of_nav: 80
  max_margin_used_pct_of_nav: 10
  reject_if_margin_closeout_percent_above: 20

spread_filter:
  enabled: true
  max_spread_to_atr_pct: 8.0
  max_spread_pips:
    EUR_USD: 1.5
    GBP_USD: 2.5
    USD_JPY: 2.0
    AUD_USD: 2.0
    USD_CAD: 2.5
    USD_CHF: 2.0
    NZD_USD: 2.5

session_filter:
  enabled: true
  timezone: America/New_York
  block_new_trades:
    - name: rollover
      start: "16:45"
      end: "17:15"
    - name: friday_close
      day: Friday
      start: "15:00"
      end: "23:59"
    - name: sunday_open
      day: Sunday
      start: "00:00"
      end: "19:00"

backtest:
  fixed_slippage_pips: 0.2
  spread_slippage_multiplier: 0.5
  starting_equity_usd: 500
  commission_per_unit: 0.0
