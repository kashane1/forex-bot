# CAMPAIGN_027 — Filtered H4 z-score mean reversion. RESEARCH SCAFFOLD ONLY.
#
# h4_filtered_zscore_reversion 0.1.0-c027 — H4 execution, short-only, low-vol +
# quiet-session + strong-extension filtered. The single idea that survived the
# edge-discovery front gate (still borderline; 2024/2026 negative).
# Precommit: docs/research/CAMPAIGN_027_PRECOMMIT_H4_FILTERED_ZSCORE_REVERSION_SCOPE.md
#
# NOT APPROVED. configs/approved_strategies.yaml remains approved: [].
# Full evidence requires a separate execution sprint. Test lockbox stays closed.

campaign:
  id: CAMPAIGN_027
  strategy_family: h4_filtered_zscore_reversion
  version: 0.1.0-c027
  not_approved: true
  scaffold_only: true
  promotion_eligible: false
  paper_demo_live_enabled: false
  status: SCAFFOLD_ONLY

research_metadata:
  fill_timing: next_bar_open
  execution_realism: conservative
  evidence_use: approval_bound
  promotion_eligible: false

data_provenance:
  execution_h4: native_h4
  store: data/campaign_002.sqlite3
  new_fetch_allowed: false

financing:
  financing_mode: none
  financing_overlay_required: true
  observed_financing_status: blocked_pending_practice_sample

cost_model:
  optimistic: realized_spread_plus_2x_0p2pip_slip
  conservative: 1p5pip_spread_plus_2x_0p2pip_slip_plus_financing_over_12_bars
  binding_metric: conservative
  stress: 2x_conservative

app:
  name: oanda-forex-research-bot
  mode: paper
  trading_enabled: false
  allow_order_submission: false
  allow_live_trading: false
  database_path: ./data/campaign_002.sqlite3
  log_path: ./logs/campaign_027.jsonl
  kill_switch_path: ./KILL_SWITCH

broker:
  name: oanda
  environment: practice
  account_id_env: OANDA_ACCOUNT_ID_PRACTICE
  token_env: OANDA_ACCESS_TOKEN_PRACTICE
  request_timeout_seconds: 15
  max_retries: 3

market:
  account_currency: USD
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - AUD_USD
    - USD_CAD
    - USD_CHF
    - NZD_USD
  granularity: H4
  candle_price_components: BA
  daily_alignment: 17
  alignment_timezone: America/New_York
  weekly_alignment: Friday

strategy:
  enabled:
    - h4_filtered_zscore_reversion
  h4_filtered_zscore_reversion:
    version: 0.1.0-c027
    timeframe: H4
    zscore_lookback: 20
    zscore_std_ddof: 1
    base_trigger_abs_z: 2.0
    strong_extension_abs_z: 2.5
    atr_lookback: 14
    atr_percentile_window: 250
    atr_percentile_max: 0.33
    quiet_sessions:
      - asia
      - london
    side_mode: short_only
    atr_stop_multiple: 3.0
    max_bars_in_trade: 12

risk:
  starting_equity_usd: 500
  risk_per_trade_pct: 0.25
  max_risk_per_trade_pct: 0.50
  max_daily_loss_pct: 1.00
  max_weekly_loss_pct: 2.00
  max_total_drawdown_pct: 8.00
  max_open_positions: 1
  max_pending_orders: 1
  max_correlated_positions: 1
  max_positions_per_instrument: 1
  require_stop_loss: true
  require_server_side_protection: true
  allow_martingale: false
  allow_grid: false
  allow_averaging_down: false

margin:
  min_margin_available_pct_of_nav: 80
  max_margin_used_pct_of_nav: 10
  reject_if_margin_closeout_percent_above: 20

spread_filter:
  enabled: true
  max_spread_to_atr_pct: 8.0
  max_spread_pips:
    EUR_USD: 1.5
    GBP_USD: 2.5
    USD_JPY: 2.0
    AUD_USD: 2.0
    USD_CAD: 2.5
    USD_CHF: 2.0
    NZD_USD: 2.5

session_filter:
  enabled: true
  timezone: America/New_York
  block_new_trades:
    - name: rollover
      start: "16:45"
      end: "17:15"
    - name: friday_close
      day: Friday
      start: "15:00"
      end: "23:59"
    - name: sunday_open
      day: Sunday
      start: "00:00"
      end: "19:00"

backtest:
  fixed_slippage_pips: 0.2
  spread_slippage_multiplier: 0.5
  starting_equity_usd: 500
  commission_per_unit: 0.0
