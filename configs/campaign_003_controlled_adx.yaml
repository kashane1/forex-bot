# CAMPAIGN_003 — controlled ADX-filtered trend following.
#
# Strategy version: trend_following 0.2.0-c003
#   = frozen 0.1.0-baseline-frozen rules + three pre-committed conditions:
#     1. H4 only (granularity below).
#     2. Universe excludes NZD_USD (cost-structure exclusion — see
#        docs/research/CAMPAIGN_003_PROPOSAL.md).
#     3. ADX-14 > 25 trend-strength gate (adx_min below).
#
# The ADX threshold (25) is pre-committed and is NOT swept or tuned.
# There is no robustness grid in the decision path.
#
# DATA REUSE: database_path points at data/campaign_002.sqlite3 — the
# exact real OANDA practice H4 candles from CAMPAIGN_002, with provenance
# hashes already recorded in that DB's data_sources table and the
# CAMPAIGN_002 report. No re-fetch; no synthetic data.

app:
  name: oanda-forex-research-bot
  mode: paper
  trading_enabled: false
  allow_order_submission: false
  allow_live_trading: false
  database_path: ./data/campaign_002.sqlite3
  log_path: ./logs/campaign_003.jsonl
  kill_switch_path: ./KILL_SWITCH

broker:
  name: oanda
  environment: practice
  account_id_env: OANDA_ACCOUNT_ID_PRACTICE
  token_env: OANDA_ACCESS_TOKEN_PRACTICE
  request_timeout_seconds: 15
  max_retries: 3

market:
  account_currency: USD
  # Six pairs — NZD_USD excluded on cost structure (widest median spread).
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - AUD_USD
    - USD_CAD
    - USD_CHF
  granularity: H4
  candle_price_components: BA
  daily_alignment: 17
  alignment_timezone: America/New_York
  weekly_alignment: Friday

strategy:
  enabled:
    - trend_following
  trend_following:
    version: 0.2.0-c003
    timeframe: H4
    ema_fast: 50
    ema_slow: 200
    donchian_lookback: 20
    atr_lookback: 14
    atr_stop_multiple: 2.0
    trailing_stop_atr_multiple: 2.0
    adx_lookback: 14
    adx_min: 25.0
    min_atr_pips: {}
    max_bars_in_trade: 240

risk:
  starting_equity_usd: 500
  risk_per_trade_pct: 0.25
  max_risk_per_trade_pct: 0.50
  max_daily_loss_pct: 1.00
  max_weekly_loss_pct: 2.00
  max_total_drawdown_pct: 8.00
  max_open_positions: 1
  max_pending_orders: 1
  max_correlated_positions: 1
  max_positions_per_instrument: 1
  require_stop_loss: true
  require_server_side_protection: true
  allow_martingale: false
  allow_grid: false
  allow_averaging_down: false

margin:
  min_margin_available_pct_of_nav: 80
  max_margin_used_pct_of_nav: 10
  reject_if_margin_closeout_percent_above: 20

spread_filter:
  enabled: true
  max_spread_to_atr_pct: 8.0
  max_spread_pips:
    EUR_USD: 1.5
    GBP_USD: 2.5
    USD_JPY: 2.0
    AUD_USD: 2.0
    USD_CAD: 2.5
    USD_CHF: 2.0

session_filter:
  enabled: true
  timezone: America/New_York
  block_new_trades:
    - name: rollover
      start: "16:45"
      end: "17:15"
    - name: friday_close
      day: Friday
      start: "15:00"
      end: "23:59"
    - name: sunday_open
      day: Sunday
      start: "00:00"
      end: "19:00"

backtest:
  fixed_slippage_pips: 0.2
  spread_slippage_multiplier: 0.5
  starting_equity_usd: 500
  commission_per_unit: 0.0
