# CAMPAIGN_015 — Failed-breakout reversal (research candidate scaffold)
# RESEARCH CANDIDATE SCAFFOLD ONLY — NOT APPROVED FOR PAPER / DEMO / LIVE.
#
# Strategy: failed_breakout_reversal 0.1.0-c015 — the C8 Failed-
# Breakout Reversal candidate (CAMPAIGN_015 sprint). The strategy fades
# failed range-extreme sweeps: at the latest completed H4 bar t, if
# high[t] pokes above the prior 20-bar Donchian high by at least
# sweep_buffer_atr*ATR(14) and close[t] closes back below prior_high,
# emit a short signal (and symmetric for downside). Hard ATR-band stop
# beyond the sweep extreme + 12-bar time stop. No take-profit, no
# trailing stop, no midline target. Primary fill timing: next_bar_open.
#
# Frozen parameters pre-committed BEFORE any backtest run by the
# CAMPAIGN_015 sprint (Phase 0 pre-commit doc, §5); any deviation
# constitutes a NEW candidate. The Pydantic validator on
# FailedBreakoutReversalStrategyConfig rejects several specific
# deviations explicitly (take_profit_r not null in v1; trailing-stop
# in v1; same_bar_adverse_stop_wins must be true; min/max bounds).
#
# Exact rules + parameter rationale:
# - docs/research/CAMPAIGN_015_FAILED_BREAKOUT_REVERSAL_PRECOMMIT.md
#
# Loading this config does NOT approve the strategy.
# configs/approved_strategies.yaml remains approved: [] and the
# paper-loop / demo-loop refusal still blocks every order-capable loop.
#
# DATA REUSE: database_path points at data/campaign_002.sqlite3 — the
# real OANDA practice H4 candles already validated by CAMPAIGN_002 /
# CAMPAIGN_010 / CAMPAIGN_011 / CAMPAIGN_012 / CAMPAIGN_013 /
# CAMPAIGN_014. No re-fetch, no synthetic data. If the file is absent,
# the Phase 3 runner produces a BLOCKED artifact.
#
# CAMPAIGN_001 - 014 all REJECT and untouched. CAMPAIGN_011 is the
# NULL BASELINE that the Phase 4 diagnostic must beat by a meaningful
# margin; it is NOT itself a trading candidate.

app:
  name: oanda-forex-research-bot
  mode: paper
  trading_enabled: false
  allow_order_submission: false
  allow_live_trading: false
  database_path: ./data/campaign_002.sqlite3
  log_path: ./logs/campaign_015.jsonl
  kill_switch_path: ./KILL_SWITCH

broker:
  name: oanda
  environment: practice
  account_id_env: OANDA_ACCOUNT_ID_PRACTICE
  token_env: OANDA_ACCESS_TOKEN_PRACTICE
  request_timeout_seconds: 15
  max_retries: 3

market:
  account_currency: USD
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - AUD_USD
    - USD_CAD
    - USD_CHF
    - NZD_USD
  granularity: H4
  candle_price_components: BA
  daily_alignment: 17
  alignment_timezone: America/New_York
  weekly_alignment: Friday

strategy:
  enabled:
    - failed_breakout_reversal
  failed_breakout_reversal:
    version: 0.1.0-c015
    timeframe: H4
    range_lookback: 20
    atr_lookback: 14
    adx_lookback: 14
    adx_max: 20.0
    sweep_buffer_atr: 0.10
    min_range_atr_multiple: 1.25
    max_range_atr_multiple: 5.00
    stop_buffer_atr: 0.10
    min_stop_atr_multiple: 0.80
    max_stop_atr_multiple: 2.20
    max_bars_in_trade: 12
    take_profit_r: null
    trailing_stop_atr_multiple: null
    entry_timing: next_bar_open
    same_bar_adverse_stop_wins: true
    min_atr_pips: {}

risk:
  starting_equity_usd: 500
  risk_per_trade_pct: 0.25
  max_risk_per_trade_pct: 0.50
  max_daily_loss_pct: 1.00
  max_weekly_loss_pct: 2.00
  max_total_drawdown_pct: 8.00
  max_open_positions: 1
  max_pending_orders: 1
  max_correlated_positions: 1
  max_positions_per_instrument: 1
  require_stop_loss: true
  require_server_side_protection: true
  allow_martingale: false
  allow_grid: false
  allow_averaging_down: false

margin:
  min_margin_available_pct_of_nav: 80
  max_margin_used_pct_of_nav: 10
  reject_if_margin_closeout_percent_above: 20

spread_filter:
  enabled: true
  max_spread_to_atr_pct: 8.0
  max_spread_pips:
    EUR_USD: 1.5
    GBP_USD: 2.5
    USD_JPY: 2.0
    AUD_USD: 2.0
    USD_CAD: 2.5
    USD_CHF: 2.0
    NZD_USD: 2.5

session_filter:
  enabled: true
  timezone: America/New_York
  block_new_trades:
    - name: rollover
      start: "16:45"
      end: "17:15"
    - name: friday_close
      day: Friday
      start: "15:00"
      end: "23:59"
    - name: sunday_open
      day: Sunday
      start: "00:00"
      end: "19:00"

backtest:
  fixed_slippage_pips: 0.2
  spread_slippage_multiplier: 0.5
  starting_equity_usd: 500
  commission_per_unit: 0.0
