[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forex-bot"
version = "0.1.0"
description = "Demo-first OANDA forex research and execution bot. Engineering research, not financial advice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kashane" }]
keywords = ["forex", "oanda", "trading", "research", "backtest"]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "freezegun>=1.5",
]
research = [
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "jinja2>=3.1",
]
# Optional secondary backtesting/verification lane. Local-only.
# See docs/research/INFRA_BACKTRADER_SECONDARY_LANE_001_PLAN.md.
# DO NOT use Backtrader's old OANDA / live-broker integration paths.
backtrader-lane = [
    "backtrader>=1.9.78,<2.0",
]

[project.scripts]
bot = "forex_bot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forex_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that touch real services (skipped by default)",
    "smoke: practice-account smoke tests (require OANDA_*_PRACTICE env vars)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",   # line length: enforced informally
    "B008",   # function call in default arg: typer.Option / typer.Argument pattern
    "B904",   # raise-from: typer.Exit is a control-flow sentinel, not an error
    "SIM102", # nested if: kept for readability in safety-critical config gates
    "SIM105", # contextlib.suppress: try/except/pass is fine for two-line shutdown
    "SIM108", # ternary: less readable for parser fallbacks
    "N818",   # ConfigError naming
    "RUF001", # × in strings: intentional for human-readable status
    "RUF002", # × in docstrings: intentional
    "RUF003", # × in comments: intentional for human-readable arithmetic
    "RUF005", # list concat vs splat: stylistic
    "RUF007", # itertools.pairwise vs zip: equivalent here
    "RUF059", # unused unpacked vars are sometimes documentation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "B017", "E731", "SIM117", "F841", "B011"]
# Campaign scripts run `sys.path.insert()` before importing forex_bot so they
# work standalone; E402 (import-not-at-top) is intentional there.
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
